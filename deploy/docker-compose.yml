# Production stack on the server (/opt/spektrum). Values come from .env next to this file,
# which the GitHub Actions deploy writes: APP_IMAGE, SITE_ADDRESS, POSTGRES_PASSWORD,
# GEMINI_API_KEY, BACKUP_BUCKET.
name: spektrum

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vocab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: vocab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocab -d vocab"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${APP_IMAGE:?set in .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://vocab:${POSTGRES_PASSWORD}@postgres:5432/vocab
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-60}
    volumes:
      - uploads:/data/uploads

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
