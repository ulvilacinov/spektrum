services:
  postgres:
    image: postgres:16-alpine
    container_name: vocab-postgres
    environment:
      POSTGRES_USER: vocab
      POSTGRES_PASSWORD: vocab
      POSTGRES_DB: vocab
    ports:
      - "5432:5432"
    volumes:
      - vocab-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocab -d vocab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vocab-pgdata:
