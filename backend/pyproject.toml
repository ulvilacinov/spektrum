[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vocab-backend"
version = "0.1.0"
description = "Backend for an AI-assisted German vocabulary learning application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Web / API
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",      # multipart/form-data file uploads (STEP 2)
    # Validation / configuration
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    # Database
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    # PDF parsing (STEP 2)
    "pymupdf>=1.24",
    # AI provider (Gemini implementation, STEP 3)
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat the package as first-party.
known-third-party = ["alembic"]
