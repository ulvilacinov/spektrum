# Fly.io: one machine in Frankfurt serving UI + API; PostgreSQL is on Neon (DATABASE_URL
# secret). Secrets (fly secrets set): DATABASE_URL, GEMINI_API_KEY.
app = "spektrum-kelime"
primary_region = "fra"

[build]

[deploy]
  # A failed migration stops the deploy; the running version stays up.
  release_command = "alembic upgrade head"

[env]
  ENVIRONMENT = "production"
  SESSION_COOKIE_SECURE = "true"
  AI_REQUESTS_PER_MINUTE = "60"

[http_service]
  internal_port = 8000
  force_https = true
  # Stopped when idle, started by the first request (a few seconds): almost free.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

# Uploaded PDFs (needed again only when a document is re-analyzed).
[[mounts]]
  source = "uploads"
  destination = "/data/uploads"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
