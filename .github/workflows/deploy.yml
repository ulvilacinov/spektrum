name: CI and deploy

# Every push to main: tests → deploy to Fly.io (image built by Fly's remote builder;
# migrations run as the release command before the new version goes live).
# Pull requests only run the tests. The deploy needs the repository secret FLY_API_TOKEN
# (fly tokens create deploy) and waits until the repository variable FLY_DEPLOY is "true".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Backend checks
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          ruff check .
          pytest -q

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run format:check
          npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && vars.FLY_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Check the public address
        run: |
          app=$(grep '^app = ' fly.toml | cut -d'"' -f2)
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://${app}.fly.dev/api/health"
          echo
          echo "Live: https://${app}.fly.dev"
