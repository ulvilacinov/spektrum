name: CI and deploy

# Every push to main: tests → Docker image on GHCR → deploy to the EC2 server.
# Pull requests only run the tests. The deploy job waits until the repository variable
# DEPLOY_ENABLED is "true" (set it once the server exists).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/spektrum

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Backend checks
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          ruff check .
          pytest -q

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run format:check
          npm run build

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ secrets.EC2_HOST }}
    steps:
      - uses: actions/checkout@v5

      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host server
            HostName $HOST
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
          EOF

      - name: Write server configuration
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
        run: |
          # sslip.io: 3.120.45.67 → 3-120-45-67.sslip.io resolves to that address.
          umask 077
          cat > server.env <<EOF
          APP_IMAGE=${IMAGE}:${GITHUB_SHA}
          SITE_ADDRESS=${HOST//./-}.sslip.io
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          BACKUP_BUCKET=${BACKUP_BUCKET}
          EOF
          sed -i 's/^ *//' server.env

      - name: Deploy
        run: |
          scp deploy/docker-compose.yml deploy/Caddyfile deploy/deploy.sh deploy/backup.sh server:/opt/spektrum/
          scp server.env server:/opt/spektrum/.env
          ssh server 'chmod 600 /opt/spektrum/.env && chmod +x /opt/spektrum/*.sh'
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh server "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh server 'bash /opt/spektrum/deploy.sh'

      - name: Check the public address
        run: |
          url="https://${HOST//./-}.sslip.io/api/health"
          for _ in $(seq 1 20); do
            if curl -fsS "$url"; then echo; echo "Live: ${url%/api/health}"; exit 0; fi
            sleep 6
          done
          echo "Not reachable over HTTPS: $url" >&2
          exit 1
